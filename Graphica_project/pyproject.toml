[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphica"
# バージョンは core/version.py の __version__ が唯一の情報源。
dynamic = ["version"]
description = "PySide6 + matplotlib によるデータプロット・解析デスクトップアプリケーション"
# setuptools はプロジェクトルートの外を参照できないため、リポジトリ直下の README.md の複製を使う。
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "STsuruga" },
]
# License:: 分類子との併用は setuptools 77+ でエラーになる。
# LICENSE はプロジェクトルートの外にあるので license-files は指定できない。
license = "MIT"
keywords = ["plotting", "matplotlib", "PySide6", "data-visualization", "curve-fitting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
    "Private :: Do Not Upload",
]
# requirements.txt の実行時依存と揃える。
dependencies = [
    "PySide6==6.9.1",
    "matplotlib==3.10.7",
    "numpy==2.3.1",
    "pandas==2.3.1",
    "scipy==1.16.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
graphica = "main:main"

[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }

# プラグインが `from core.dataset import Dataset` と書くので、core / gui / models を
# トップレベルパッケージとして公開している。assets / sample_data はリソースを
# resource_path() が期待する相対位置のまま同梱するためのデータ専用パッケージ。
[tool.setuptools]
packages = [
    "graphica",
    "graphica.plugin",
    "core",
    "gui",
    "gui.dialogs",
    "gui.mixins",
    "models",
    "assets",
    "assets.icons",
    "sample_data",
]
py-modules = ["main", "ui_main_window"]
include-package-data = true

[tool.setuptools.package-data]
"assets.icons" = ["*.svg"]
"sample_data" = ["*.csv"]
# Graphica.ico はパッケージ外にあるため wheel には入らない(sdist には MANIFEST.in で入る)。

# 静的解析。確実に不具合かゴミと言えるものだけを検出する(書式・好みのルールは入れない)。
[tool.ruff]
target-version = "py310"
extend-exclude = ["ui_main_window.py"]  # pyside6-uic の生成物

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE"]
# zip(strict=) を足すと長さ不一致で例外になり挙動が変わる。
ignore = ["B905"]

# チャンクごとに別プロセスで測り、あとで `coverage combine` で束ねる。
[tool.coverage.run]
parallel = true
branch = true
source = ["core", "gui", "models"]
omit = [
    "ui_main_window.py",
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # 片側の環境でしか通らない分岐
    'if is_frozen\(\):',
    "except ImportError:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
title = "Graphica テストカバレッジ"
