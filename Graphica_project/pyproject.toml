[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI の graphica は別人のツールなので配布名だけ変える。import 名と起動コマンドは graphica。
name = "graphica-plot"
# バージョンは core/version.py の __version__ が唯一の情報源。
dynamic = ["version"]
description = "PySide6 + matplotlib によるデータプロット・解析デスクトップアプリケーション"
# setuptools はプロジェクトルートの外を参照できないため、リポジトリ直下の README.md の複製を使う。
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "STsuruga" },
]
# License:: 分類子との併用は setuptools 77+ でエラーになる。
# setuptools はプロジェクトの外を参照できないので、リポジトリ直下の LICENSE と THIRD_PARTY_LICENSES.md の複製を置く
# (tests/test_packaging.py が直下のものと同じ中身か確かめる)。同梱のアイコン(Tabler Icons, MIT)の表示もここに入る。
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
keywords = ["plotting", "matplotlib", "PySide6", "data-visualization", "curve-fitting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Qt",
]
# 利用者の環境とぶつからないよう範囲で指定する。下限は requires-python の 3.10 でも入る版。
# 上限は、フルスイートで確かめた範囲まで。PySide6 と matplotlib は minor 版で挙動が変わる
# (matplotlib 3.11 では描画中にプロセスが落ちる。K-16)ので、確かめた minor 版に留める。
# exe のビルドと CI のテストは requirements.txt の固定版。CI の install-check が 3.10 と 3.13 で起動を確かめる。
dependencies = [
    "PySide6>=6.9,<6.10",
    "matplotlib>=3.10,<3.11",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/STsuruga/Graphica"
Changelog = "https://github.com/STsuruga/Graphica/blob/master/CHANGELOG.md"
Issues = "https://github.com/STsuruga/Graphica/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
build = ["pyinstaller==6.16.0"]

# Windows でコンソール(黒い画面)を開かない起動コマンド。ログを見たいときは python -m graphica
[project.gui-scripts]
graphica = "graphica.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "graphica.core.version.__version__" }

# トップレベルは graphica だけ(core / gui / models のような一般的な名前を環境に入れない)。
# プラグインが使ってよいのは graphica.plugin と graphica.plugin.testing。
# assets / sample_data はリソースを resource_path() の相対位置のまま同梱するためのデータ専用パッケージ。
[tool.setuptools]
packages = [
    "graphica",
    "graphica.plugin",
    "graphica.core",
    "graphica.gui",
    "graphica.gui.datasets",
    "graphica.gui.dialogs",
    "graphica.gui.mixins",
    "graphica.models",
    "graphica.assets",
    "graphica.assets.icons",
    "graphica.sample_data",
]
include-package-data = true

[tool.setuptools.package-data]
"graphica" = ["Graphica.ico"]
"graphica.assets.icons" = ["*.svg"]
"graphica.sample_data" = ["*.csv"]

# 静的解析。確実に不具合かゴミと言えるものだけを検出する(書式・好みのルールは入れない)。
[tool.ruff]
target-version = "py310"
extend-exclude = ["graphica/ui_main_window.py"]  # pyside6-uic の生成物

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE"]
# zip(strict=) を足すと長さ不一致で例外になり挙動が変わる。
ignore = ["B905"]

# チャンクごとに別プロセスで測り、あとで `coverage combine` で束ねる。
[tool.coverage.run]
parallel = true
branch = true
source = ["graphica"]
omit = [
    "graphica/ui_main_window.py",
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # 片側の環境でしか通らない分岐
    'if is_frozen\(\):',
    "except ImportError:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
title = "Graphica テストカバレッジ"
