name: Publish to PyPI

# v* タグの push で graphica-plot を TestPyPI に上げ、そこから入れて起動できたら本番の PyPI に上げる。
# トークンは使わず Trusted Publishing。PyPI / TestPyPI の Publisher 登録は、このファイル名と
# 環境名(testpypi / pypi)で行う(手順は Graphica_project/docs/dev/RELEASE_CHECKLIST.md)。
# PyPI は同じ版を二度上げられないので、失敗したら版を上げてタグを打ち直す。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Graphica_project
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the version
        id: version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('graphica/core/version.py').read_text(encoding='utf-8')).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: Graphica_project/dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  check-testpypi:
    needs: [build, testpypi]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Graphica_project
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # TestPyPI からは graphica-plot だけを取る。依存まで TestPyPI から取ると、誰でも上げられる
      # 同名の偽パッケージが入りうる。上げた直後は索引に出るまで少しかかる。
      - name: Install graphica-plot from TestPyPI
        run: |
          version=${{ needs.build.outputs.version }}
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --no-deps --only-binary :all: -d testpypi \
                 --index-url https://test.pypi.org/simple/ "graphica-plot==$version"; then
              break
            fi
            sleep 30
          done
          python -m pip install testpypi/graphica_plot-*.whl
          python -m pip list

      - name: Start the installed app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/check_installed_app.py

  pypi:
    needs: check-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
