name: Tests

# lint・型検査・テスト(Windows と macOS)と、pip で入れた版の起動確認。exe と .app は package.yml。
# - テストは scripts/run_tests_chunked.sh で回す(小分けにして別プロセスで並列に流す)。
#   さらにチャンクをジョブに分けて(GRAPHICA_TEST_SHARD)同時に流す。Windows は 3 つ、macOS は PR などで 2 つ。
#   ジョブ名は test-windows (1) などになる(ブランチ保護の必須チェックには使っていない)。
# - カバレッジは master のランの macOS ジョブだけで測る(計測すると遅くなるため、タグと PR では測らない)。
#   HTML のレポートは成果物 coverage-html に残し、pages.yml がサイトと一緒に GitHub Pages に公開する。
# - 開発用の文書だけの変更では動かない(テストが読む README.md・THIRD_PARTY_LICENSES.md は対象のまま)。

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    # タグの push にはパスの条件は効かない(タグでは必ず動く)
    paths:
      - "**"
      - "!*.md"
      - "THIRD_PARTY_LICENSES.md"
      - "!Graphica_project/docs/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/pull_request_template.md"
  pull_request:
    branches:
      - master
      - refactor/architecture
    paths:
      - "**"
      - "!*.md"
      - "THIRD_PARTY_LICENSES.md"
      - "!Graphica_project/docs/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/pull_request_template.md"
  workflow_dispatch: {}

# 同じ ref の古いランは取り消す。タグは ref が別なので master の push に取り消されない。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    # テストがモーダルなどで止まると、既定では 6 時間待ってから落ちる
    timeout-minutes: 60
    strategy:
      # ほかのシャードの結果も見られるよう、1 つが落ちても止めない
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 重いテストより前に落とす。設定は pyproject.toml の [tool.ruff]。どのシャードでも同じなので 1 つ目だけ
      - name: Lint
        if: matrix.shard == 1
        run: ruff check .

      # 対象と設定は pyproject.toml の [tool.mypy](core/ とプラグインの入口)。
      - name: Type check
        if: matrix.shard == 1
        run: mypy

      - name: Run tests
        shell: bash
        env:
          GRAPHICA_TEST_SHARD: ${{ matrix.shard }}/3
        run: bash scripts/run_tests_chunked.sh

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # master はカバレッジを 1 つのジョブで測る(ジョブをまたいで結合しない)。PR の待ち時間には関係しない
        shard: ${{ fromJSON(github.ref == 'refs/heads/master' && '[1]' || '[1, 2]') }}

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: bash scripts/run_coverage.sh

      - name: Run tests
        if: github.ref != 'refs/heads/master'
        shell: bash
        env:
          GRAPHICA_TEST_SHARD: ${{ matrix.shard }}/2
        run: bash scripts/run_tests_chunked.sh

      - name: Upload coverage report
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: Graphica_project/htmlcov
          retention-days: 90

  install-check:
    # pip で入れた版(範囲指定の依存)が、まっさらな環境で起動するか。3.10 では範囲の下の方の版、
    # 3.13 では最新の版が入る。テストの本体は固定版の build-* が回すので、ここは起動の確認だけ。
    runs-on: windows-latest
    # ふだんは 2 分かからない。起動がダイアログで止まったら早く落とす
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    defaults:
      run:
        working-directory: Graphica_project
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/graphica_plot-*.whl
          python -m pip list

      - name: Start the installed app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/check_installed_app.py
