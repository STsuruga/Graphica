name: Build

# Graphica_project/ の Windows exe / macOS .app を PyInstaller でビルドし、Actions の
# アーティファクトとして上げる。
# - ビルドには Graphica_project/graphica.spec を使う(リポジトリ直下の古い .spec は使わない)。
# - secrets を要する署名・公証・公開は含めない。macOS 版は未署名で Apple Silicon 向け。
# - テストは必ず scripts/run_tests_chunked.sh で回す。1 プロセスで全件流すと Qt/matplotlib の
#   資源がたまって進むほど遅くなり、事実上止まる。
# - カバレッジは master のランの macOS ジョブだけで測り、GitHub Pages に公開する
#   (計測すると約 8 分延びるため、タグと PR では測らない)。Pages のソースは「GitHub Actions」前提。

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

# 同じ ref の古いランは取り消す。タグは ref が別なので master の push に取り消されない。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 重いテストより前に落とす。設定は pyproject.toml の [tool.ruff]。
      - name: Lint
        run: ruff check .

      - name: Run tests
        shell: bash
        run: bash scripts/run_tests_chunked.sh

      - name: Build exe with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      # 同梱の Qt/PySide6 は LGPL v3 のため、条文と差し替えの案内を必ず同梱する。
      - name: Bundle license files
        shell: bash
        run: |
          cp ../LICENSE dist/Graphica/
          cp ../THIRD_PARTY_LICENSES.md dist/Graphica/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-windows
          path: Graphica_project/dist/Graphica/
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow coverage

      - name: Run tests with coverage
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: bash scripts/run_coverage.sh

      - name: Run tests
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: bash scripts/run_tests_chunked.sh

      - name: Prepare coverage site
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          mkdir -p _site/coverage
          cp -R htmlcov/. _site/coverage/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=coverage/">
          <title>Graphica</title>
          <a href="coverage/">テストカバレッジ</a>
          HTML

      - name: Upload coverage site for Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Graphica_project/_site

      - name: Generate macOS icon (.icns) from Graphica.ico
        # .icns はリポジトリに置かず、Graphica.ico の最大フレームから都度生成する。
        run: |
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("Graphica.ico")
          sizes = im.info.get("sizes", [im.size])
          best = max(sizes, key=lambda s: s[0])
          im.size = best
          im.load()
          im.convert("RGBA").save("Graphica.icns", format="ICNS")
          PY

      - name: Build .app with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      - name: Zip .app bundle with license files
        # .app はシンボリックリンクを含むので ditto で固めてから上げる。ライセンスは
        # 二重 zip にならないよう .app と同じ階層に並べて 1 つの zip にする。
        run: |
          mkdir -p staging
          cp -R dist/Graphica.app staging/
          cp ../LICENSE ../THIRD_PARTY_LICENSES.md staging/
          ditto -c -k --sequesterRsrc staging dist/Graphica-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-macos
          path: Graphica_project/dist/Graphica-macos.zip
          if-no-files-found: error

  deploy-coverage:
    # テストが緑の master だけ公開する(公開中のレポートは最後に緑だった master)。
    needs: build-macos
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}coverage/

    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
