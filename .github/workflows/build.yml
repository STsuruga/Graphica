name: Build

# Graphica (Graphica_project/) の Windows exe / macOS .app を PyInstaller で
# ビルドし、成果物を Actions のアーティファクトとしてアップロードする
# ワークフロー。
#
# 注意:
# - リポジトリルートの Graphica_ver1.spec / main_ver6.spec は現行レイアウト
#   より前の古いファイルなので使用しない。ビルドには
#   Graphica_project/graphica.spec を使う (Windows/macOS共用、sys.platform
#   で分岐)。
# - 署名・公証(notarization)・PyPI公開・リリース作成等、secrets を要する
#   外部公開ステップは意図的に含めていない (アーティファクトのアップロード
#   までが範囲)。macOS版は未署名のため、初回起動時にGatekeeperの警告が出る
#   (README側で右クリック起動の回避方法を案内)。
# - macOSビルドは GitHub Actions の macos-latest ランナー (Apple Silicon /
#   arm64) 上で行うため、生成される .app は Apple Silicon Mac 向け。
#   Intel Mac向けが必要になった場合は macos-13 等のIntelランナーを使う
#   ジョブを別途追加する。
# - テストは `pytest` 一括実行ではなく scripts/run_tests_chunked.sh 経由で
#   ファイル単位に分けたプロセスで実行する。フルスイートを1プロセスで
#   通しで実行すると、テスト間でQt/matplotlibのリソースが解放されず
#   蓄積し、進行するほど遅くなって最終的に事実上ハングする既知の問題が
#   あるため (scripts/run_tests_chunked.sh のコメント参照)。
# - テストカバレッジは **master のランの macOS ジョブだけ** で計測し、その HTML
#   レポートを deploy-coverage ジョブが GitHub Pages
#   (https://stsuruga.github.io/Graphica/coverage/) に公開する。テストが失敗した
#   ランでは公開しない(公開中のレポートは最後に緑だった master)。
#   計測すると macOS ジョブが約11分→約19.5分に伸びる(実測)ため、タグの push
#   (リリースビルド)では計測せず通常のチャンク実行にする(ユーザー判断)。
#   タグは同じコミットの master ランで計測済みなので、情報は失われない。
#   リポジトリ設定で Pages のソースを「GitHub Actions」にしてあることが前提。

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

# 同じref(masterブランチ、または個々のタグ)への新しいpushが来たら、その
# refに対する古い実行中ランを自動キャンセルする。ref単位でグループ化して
# いるため、masterへの連続pushは互いにキャンセルし合うが、リリースタグの
# push(v1.2.0等)はmasterの状況に関わらず独立して最後まで走る。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: bash
        run: bash scripts/run_tests_chunked.sh

      - name: Build exe with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      # 配布物にライセンス関連を同梱する。同梱している Qt/PySide6 は LGPL v3 で、
      # 条文の提示と「利用者が Qt を差し替えられること」の案内が要るため、
      # exe だけを配ると条件を満たせない (THIRD_PARTY_LICENSES.md 参照)。
      - name: Bundle license files
        shell: bash
        run: |
          cp ../LICENSE dist/Graphica/
          cp ../THIRD_PARTY_LICENSES.md dist/Graphica/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-windows
          path: Graphica_project/dist/Graphica/
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow coverage

      - name: Run tests with coverage
        # master のランだけ。scripts/run_coverage.sh は run_tests_chunked.sh を
        # カバレッジ付きで回し、htmlcov/ を生成する。終了コードはテスト側の
        # 結果をそのまま返す。
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: bash scripts/run_coverage.sh

      - name: Run tests
        # master 以外(リリースタグ等)は計測なしで速く回す。
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: bash scripts/run_tests_chunked.sh

      - name: Prepare coverage site
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          mkdir -p _site/coverage
          cp -R htmlcov/. _site/coverage/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=coverage/">
          <title>Graphica</title>
          <a href="coverage/">テストカバレッジ</a>
          HTML

      - name: Upload coverage site for Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Graphica_project/_site

      - name: Generate macOS icon (.icns) from Graphica.ico
        # Graphica.icns 自体はリポジトリに含めず、Windows用の Graphica.ico
        # (複数解像度を内包) から都度生成する。ico内で最大のフレームを
        # 使うため、元絵の解像度次第ではicnsとしてはやや粗い点に注意。
        run: |
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("Graphica.ico")
          sizes = im.info.get("sizes", [im.size])
          best = max(sizes, key=lambda s: s[0])
          im.size = best
          im.load()
          im.convert("RGBA").save("Graphica.icns", format="ICNS")
          PY

      - name: Build .app with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      - name: Zip .app bundle with license files
        # .app はFrameworks配下にシンボリックリンクを含むため、
        # actions/upload-artifact に生フォルダとして渡すと展開後に壊れることがある。
        # macOS純正の ditto で圧縮してから単一ファイルとしてアップロードする。
        #
        # ★ ライセンス (LGPL v3 の条文同梱、THIRD_PARTY_LICENSES.md 参照) は
        #   .app と一緒に**1つのzipへ**入れる。以前は .app を単体で ditto して
        #   から zip で包み直していたが、それだと利用者が「zipを展開したら
        #   中にまたzipがある」二重zipになってしまう。ステージング用の
        #   ディレクトリに .app とライセンスを並べ、それごと ditto すれば
        #   シンボリックリンクを保ったまま1段で展開できる。
        run: |
          mkdir -p staging
          cp -R dist/Graphica.app staging/
          cp ../LICENSE ../THIRD_PARTY_LICENSES.md staging/
          ditto -c -k --sequesterRsrc staging dist/Graphica-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-macos
          path: Graphica_project/dist/Graphica-macos.zip
          if-no-files-found: error

  deploy-coverage:
    # macOS ジョブ(テスト〜ビルドまで)が成功した master のランだけ公開する。
    needs: build-macos
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}coverage/

    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
