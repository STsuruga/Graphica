name: Package

# Graphica_project/ の Windows exe・インストーラーと macOS .app を PyInstaller で作り、Actions の
# アーティファクトとして上げる(リリースはこれを使う)。テストは build.yml。
# - ビルドには Graphica_project/graphica.spec を使う(リポジトリ直下の古い .spec は使わない)。
# - secrets を要する署名・公証・公開は含めない。macOS 版は未署名で Apple Silicon 向け。
# - PR では、作り方に関わるファイルを変えたときだけ動く(ほかの変更で壊れることはまず無く、毎回は 2 分ずつ無駄になる)。

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - "Graphica_project/graphica.spec"
      - "Graphica_project/installer/**"
      - "Graphica_project/requirements.txt"
      - "Graphica_project/pyproject.toml"
      - "Graphica_project/main.py"
      - "Graphica_project/graphica/__main__.py"
      - "Graphica_project/graphica/Graphica.ico"
      - "Graphica_project/graphica/assets/**"
      - "Graphica_project/graphica/sample_data/**"
      - "Graphica_project/graphica/plugin/**"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/package.yml"
  workflow_dispatch: {}

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      # プラグイン向けに入れた scipy.cluster(本体は使わない)が本当に同梱されたか。拡張モジュールの有無で見る
      - name: Check bundled scipy.cluster
        shell: bash
        run: |
          for mod in _vq _hierarchy; do
            find dist -path "*scipy/cluster/${mod}*" | grep -q . || { echo "scipy.cluster.${mod} が同梱されていない"; exit 1; }
          done

      # 同梱の Qt/PySide6 は LGPL v3 のため、条文と差し替えの案内を必ず同梱する。
      - name: Bundle license files
        shell: bash
        run: |
          cp ../LICENSE dist/Graphica/
          cp ../THIRD_PARTY_LICENSES.md dist/Graphica/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-windows
          path: Graphica_project/dist/Graphica/
          if-no-files-found: error

      # 関連付け(.gra / .graphica)を登録するインストーラー。Inno Setup がランナーに無ければ入れる
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "from graphica.core.version import __version__; print(__version__)"
          & $iscc "/DAppVersion=$version" installer\graphica.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 黙って入れて、exe と関連付けができ、アンインストールで消えることを確かめる(その利用者だけのインストール)
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Graphica-*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "GraphicaInstall"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/TASKS=fileassoc", "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "Graphica.exe"))) { throw "Graphica.exe was not installed" }
          foreach ($ext in ".gra", ".graphica") {
            $progid = (Get-ItemProperty "HKCU:\Software\Classes\$ext")."(default)"
            if ($progid -ne "Graphica.Project") { throw "$ext is associated with '$progid'" }
          }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\Graphica.Project\shell\open\command")."(default)"
          if ($command -notlike "*Graphica.exe*%1*") { throw "unexpected open command: $command" }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "HKCU:\Software\Classes\Graphica.Project") { throw "the association was not removed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-windows-installer
          path: Graphica_project/dist/Graphica-*-setup.exe
          if-no-files-found: error

  package-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Graphica_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate macOS icon (.icns) from Graphica.ico
        # .icns はリポジトリに置かず、graphica/Graphica.ico の最大フレームから都度生成する。
        run: |
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("graphica/Graphica.ico")
          sizes = im.info.get("sizes", [im.size])
          best = max(sizes, key=lambda s: s[0])
          im.size = best
          im.load()
          im.convert("RGBA").save("Graphica.icns", format="ICNS")
          PY

      - name: Build .app with PyInstaller
        run: pyinstaller graphica.spec --noconfirm

      # プラグイン向けに入れた scipy.cluster(本体は使わない)が本当に同梱されたか。拡張モジュールの有無で見る
      - name: Check bundled scipy.cluster
        shell: bash
        run: |
          for mod in _vq _hierarchy; do
            find dist -path "*scipy/cluster/${mod}*" | grep -q . || { echo "scipy.cluster.${mod} が同梱されていない"; exit 1; }
          done

      - name: Zip .app bundle with license files
        # .app はシンボリックリンクを含むので ditto で固めてから上げる。ライセンスは
        # 二重 zip にならないよう .app と同じ階層に並べて 1 つの zip にする。
        run: |
          mkdir -p staging
          cp -R dist/Graphica.app staging/
          cp ../LICENSE ../THIRD_PARTY_LICENSES.md staging/
          ditto -c -k --sequesterRsrc staging dist/Graphica-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Graphica-macos
          path: Graphica_project/dist/Graphica-macos.zip
          if-no-files-found: error
